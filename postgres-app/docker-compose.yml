# Postgres seul — l'application Next.js n'a pas besoin de tourner sur ce
# même VPS. Rien n'est publié sur l'extérieur par défaut : bindé sur
# 127.0.0.1, joignable uniquement via un tunnel SSH ou depuis une app qui
# tourne sur cette même machine. Pour une app hébergée ailleurs (Vercel…),
# publier le port explicitement (voir README.md) et restreindre par pare-feu.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DATABASE}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
